#!/usr/bin/env ansible-playbook
#
# MythTV playbook. Assumes ansible-playbook can be found in $PATH to
# make this executable work:
#
#    ./mythtv.yml --limit=<host>
#
# If not, then run like this:
#
#    <your path>/ansible-playbook --limit=<host> mythtv.yml
#
# <host> = one of the names under 'hosts:' in the hosts.yml file. See
# README.md for help.
#

---

- name: 'MythTV'
  hosts: mythtv_hosts
  gather_facts: false

  tasks:

    - include_role:
        name: common

    - include_role:
        name: mythtv
      when:
        - not mythtv_tools

    - include_role:
        name: perl
      when:
        - cpanm_active is defined and cpanm_active
        - not mythtv_tools

    - include_role:
        name: python
      when: not mythtv_tools

    - include_role:
        name: buildworker
      when: mythtv_builders

    - include_role:
        name: cppcheck
      when: mythtv_tools

    - include_role:
        name: doxygen
      when: mythtv_tools

...

